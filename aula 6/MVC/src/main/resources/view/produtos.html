
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            margin: 40px;
            color: #333;
        }

        h1 { color: #243b53; }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .perfil a {
            padding: 9px 12px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-left: 5px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input {
            padding: 8px;
            width: 140px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 9px 12px;
            border: none;
            border-radius: 4px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover { opacity: 0.85; }
        .perfil a:hover { opacity: 0.85; }

        .saida { background: #e67e22; }
        .excluir { background: #dc3545; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th { background: #eef2f6; }

        td form {
            display: inline-flex;
            gap: 5px;
            margin: 3px;
        }

        td input { width: 65px; }

        .mensagem { color: green; }
        .erro { color: red; }
    </style>
</head>

<body>
<div class="container">

    <div class="topo">
        <h1>Controle de Estoque</h1>

        <div class="perfil">
            <a th:href="@{/produtos/perfil/USUARIO}">Usuário</a>
            <a th:href="@{/produtos/perfil/ADM}">Administrador</a>
        </div>
    </div>

    <p class="mensagem" th:if="${mensagem}" th:text="${mensagem}"></p>
    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <div class="card">
        <h2>Cadastrar Produto</h2>

        <form th:action="@{/produtos/cadastrar}" method="post">
            <input type="text" name="nome"
                   placeholder="Nome do produto" required>
            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <div class="card">
        <h2>Produtos Cadastrados</h2>

        <p th:if="${#lists.isEmpty(produtos)}">
            Nenhum produto cadastrado.
        </p>

        <table th:unless="${#lists.isEmpty(produtos)}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Status</th>
                    <th>Movimentação</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.id}"></td>
                    <td th:text="${produto.nome}"></td>
                    <td th:text="${produto.quantidade}"></td>
                    <td th:text="${produto.status}"></td>

                    <td>
                        <div th:if="${produto.status.name() != 'DESCONTINUADO'}">

                            <form th:action="@{/produtos/{id}/entrada(id=${produto.id})}"
                                  method="post">
                                <input type="number"
                                       name="quantidade"
                                       min="1" value="1" required>
                                <button type="submit">Entrada</button>
                            </form>

                            <form th:action="@{/produtos/{id}/saida(id=${produto.id})}"
                                  method="post">
                                <input type="number"
                                       name="quantidade"
                                       min="1" value="1" required>
                                <button class="saida" type="submit">Saída</button>
                            </form>

                            <form th:if="${admin}"
                                  th:action="@{/produtos/{id}/descontinuar(id=${produto.id})}"
                                  method="post">
                                <button class="excluir" type="submit">
                                    Descontinuar (ADM)
                                </button>
                            </form>

                        </div>

                        <span th:if="${produto.status.name() == 'DESCONTINUADO'}">
                            Produto descontinuado
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
